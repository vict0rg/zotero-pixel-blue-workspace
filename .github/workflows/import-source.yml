name: Import source and publish first release
on:
  push:
    branches: [main]
    paths:
      - source-transfer.txt
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source-transfer.txt | tar -xJf -
          rm source-transfer.txt
          rm .github/workflows/import-source.yml
      - name: Validate and compile extension
        shell: bash
        run: |
          set -euo pipefail
          node --check bootstrap.js
          bash scripts/build.sh
      - name: Commit expanded source to the public repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish complete Pixel-Blue Workspace source v0.1.1"
          git push origin HEAD:main
      - name: Publish v0.1.1 XPI download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v0.1.1" dist/zotero-pixel-blue-workspace-0.1.1.xpi dist/updates.json --target main --title "Zotero Pixel-Blue Workspace v0.1.1" --notes-file CREDITS.md
