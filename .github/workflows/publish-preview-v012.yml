name: Publish Pixel-Blue v0.1.2 preview
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build Zotero extension
        shell: bash
        run: |
          set -euo pipefail
          node --check bootstrap.js
          bash scripts/build.sh
      - name: Create reversible preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.2 dist/zotero-pixel-blue-workspace-0.1.2.xpi dist/updates.json --target main --title "Pixel-Blue Workspace v0.1.2 (experimental)" --notes-file CHANGELOG.md --prerelease
